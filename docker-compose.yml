services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - productos-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  productos-data:
