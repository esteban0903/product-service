spring.application.name=productos
server.port=8080

# H2 en archivo para que los datos no se pierdan al reiniciar
spring.datasource.url=jdbc:h2:file:./data/productos
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Origenes permitidos para el frontend (separados por coma)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
